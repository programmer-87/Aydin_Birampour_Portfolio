<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ویترین راه‌حل‌های آماده | آیدین بیرام پور</title>

  <!-- فایل‌های اصلی پروژه -->
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/tailwind-build.css" />
  <link rel="stylesheet" href="assets/css/all.min.css" />
</head>

<body class="font-vazir min-h-screen antialiased solutions-page">

  <div id="scroll-progress" class="scroll-progress-bar"></div>
  <div class="bg-glow-sol"></div>

  <!-- هدر -->
  <header class="sticky top-0 z-50 backdrop-blur-md border-b" style="background: var(--bg-header-sol); border-color: var(--border-soft-sol);">
    <div class="max-w-6xl mx-auto px-5 sm:px-8">
      <nav class="flex items-center justify-between h-[72px]">
        <a href="index.html" class="group flex items-center gap-2.5">
          <span class="flex items-center justify-center w-9 h-9 rounded-lg border text-sm font-bold transition-colors" style="border-color: var(--accent-border-strong-sol); color: var(--accent-sol);">آب</span>
          <span class="font-bold text-base sm:text-lg tracking-tight transition-colors" style="color: var(--text-slateLight-sol);">آیدین بیرام پور</span>
        </a>

        <div class="flex items-center gap-2">
          <button id="theme-toggle" class="theme-toggle" aria-label="تغییر تم">
            <i class="fa-solid fa-moon" id="theme-icon"></i>
          </button>
          <a href="index.html" class="back-btn inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm">
            <i class="fa-solid fa-arrow-right text-xs"></i>
            <span class="hidden sm:inline">بازگشت به خانه</span>
          </a>
        </div>
      </nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-5 sm:px-8">
    <!-- بخش عنوان -->
    <section id="hero-section" class="pt-16 sm:pt-24 pb-12 sm:pb-16 text-center">
      <p class="fade-up inline-flex items-center gap-2 text-xs sm:text-sm tracking-widest mb-6" style="color: var(--accent-sol);">
        <span class="w-8 h-px" style="background: var(--accent-sol);"></span>
        <span>SOLUTIONS &amp; TEMPLATES</span>
        <span class="w-8 h-px" style="background: var(--accent-sol);"></span>
      </p>
      <h1 class="fade-up delay-1 text-3xl sm:text-5xl lg:text-6xl font-extrabold leading-[1.35] mb-6" style="color: var(--text-white);">
        ویترین <span class="accent-gradient">راه‌حل‌های آماده</span>
      </h1>
      <p class="fade-up delay-2 max-w-2xl mx-auto text-sm sm:text-lg leading-8" style="color: var(--text-slate-sol);">
        این پروژه‌ها پایه‌های آماده هستند و من می‌توانم آن‌ها را مطابق با نیاز کسب‌وکار شما شخصی‌سازی کنم.
      </p>
    </section>

    <!-- فیلترها + جستجو -->
    <section class="fade-up delay-3 pb-10 sm:pb-14">
      
      <!-- دکمه‌های فیلتر -->
      <div class="flex flex-wrap justify-center gap-3 mb-6">
        <button class="filter-btn active" data-filter="all">همه</button>
        <button class="filter-btn" data-filter="web">توسعه وب</button>
        <button class="filter-btn" data-filter="desktop">نرم‌افزار دسکتاپ</button>
        <button class="filter-btn" data-filter="automation">اتوماسیون</button>
        <button class="filter-btn" data-filter="telegram">ربات تلگرام</button>
        <button class="filter-btn" data-filter="graphic">طراحی گرافیک</button>
        <button class="filter-btn" data-filter="copywriting">کمپین‌نویسی</button>
      </div>

      <div class="search-wrapper">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="search-input" class="search-input" placeholder="جستجو در پروژه‌ها..." autocomplete="off" />
        <button type="button" id="clear-search" class="search-clear" aria-label="پاک کردن جستجو">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </section>

    <!-- گرید پروژه‌ها -->
    <section class="pb-24">
      <div id="projects-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>
  </main>

  <!-- مودال -->
  <div id="project-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-content">
      <button id="modal-close" class="modal-close-btn" aria-label="بستن">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div id="modal-real-content" class="modal-real-content">
        <div class="modal-gallery">
          <div class="modal-slider-track" id="slider-track"></div>
          <button id="prev-img" class="slider-nav-btn prev" aria-label="تصویر قبلی"><i class="fa-solid fa-chevron-right"></i></button>
          <button id="next-img" class="slider-nav-btn next" aria-label="تصویر بعدی"><i class="fa-solid fa-chevron-left"></i></button>
          <span id="img-counter" class="slider-counter">1 / 1</span>
          <div id="slider-dots" class="slider-dots"></div>
        </div>

        <div class="p-6 sm:p-8">
          <div class="flex items-center gap-3 mb-4">
            <div class="w-10 h-10 rounded-lg flex items-center justify-center" style="background: var(--accent-bg-sol); color: var(--accent-sol);">
              <i id="modal-icon"></i>
            </div>
            <span id="modal-category" class="text-xs px-3 py-1 rounded-full border" style="background: var(--accent-bg-sol); color: var(--accent-sol); border-color: var(--accent-border-sol);"></span>
          </div>

          <h2 id="modal-title" class="text-2xl font-bold mb-4" style="color: var(--text-white);"></h2>
          <p id="modal-long-desc" class="text-sm leading-7 mb-6 text-justify" style="color: var(--text-slate-sol);"></p>

          <h3 class="font-bold text-sm mb-3" style="color: var(--text-white);">ویژگی‌های کلیدی:</h3>
          <ul id="modal-features" class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-6"></ul>

          <h3 class="font-bold text-sm mb-3" style="color: var(--text-white);">تکنولوژی‌های استفاده شده:</h3>
          <div id="modal-tags" class="flex flex-wrap gap-2 mb-8"></div>

          <div class="flex flex-col sm:flex-row gap-3 pt-4 border-t" style="border-color: var(--border-soft-sol);">
            <a id="modal-whatsapp-btn" href="#" target="_blank" rel="noopener noreferrer" class="flex-1 flex items-center justify-center gap-2 font-bold py-3 px-6 rounded-lg transition-all" style="background: var(--accent-sol); color: var(--bg-main-sol);">
              <i class="fa-brands fa-whatsapp text-xl"></i>
              <span>درخواست شخصی‌سازی</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- دکمه بازگشت به بالا -->
  <button id="back-to-top" class="back-to-top-sol" aria-label="بازگشت به بالا">
    <i class="fa-solid fa-arrow-up"></i>
  </button>

  <!-- اسکریپت‌های اصلی -->
  <script src="assets/js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دمو نرم‌افزار صندوق فروش (POS) | آیدین بیرام پور</title>
    
    <!-- فونت وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <!-- آیکون‌ها -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --navy: #0A192F;
            --navy-light: #112240;
            --turquoise: #64FFDA;
            --white: #FFFFFF;
            --gray: #8892B0;
            --danger: #EF4444;
            --border: rgba(100, 255, 218, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }

        body {
            background-color: var(--navy);
            color: var(--white);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* ==================== بخش راست: محصولات ==================== */
        .products-section {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            border-left: 1px solid var(--border);
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 2rem;
            color: var(--turquoise);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .search-bar {
            width: 100%;
            padding: 1rem;
            background-color: var(--navy-light);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: white;
            margin-bottom: 2rem;
            outline: none;
        }

        .grid-products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1rem;
        }

        .product-card {
            background-color: var(--navy-light);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .product-card:hover {
            border-color: var(--turquoise);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(100, 255, 218, 0.1);
        }

        .product-icon {
            font-size: 2rem;
            color: var(--turquoise);
            margin-bottom: 0.5rem;
        }

        .product-name {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .product-price {
            font-size: 0.8rem;
            color: var(--gray);
        }

        /* ==================== بخش چپ: سبد خرید ==================== */
        .cart-section {
            width: 400px;
            background-color: var(--navy-light);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }

        .cart-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h2 { font-size: 1.2rem; }

        .clear-btn {
            color: var(--danger);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--navy);
            padding: 0.8rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border);
        }

        .cart-item-info h4 { font-size: 0.9rem; margin-bottom: 0.3rem; }
        .cart-item-info span { font-size: 0.8rem; color: var(--turquoise); }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .cart-item-controls button {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            border: none;
            background-color: var(--turquoise);
            color: var(--navy);
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cart-item-controls span {
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }

        .cart-footer {
            padding: 1.5rem;
            border-top: 1px solid var(--border);
            background-color: var(--navy);
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
        }

        .total-price { color: var(--turquoise); }

        .checkout-btn {
            width: 100%;
            padding: 1rem;
            background-color: var(--turquoise);
            color: var(--navy);
            border: none;
            border-radius: 0.5rem;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .checkout-btn:hover {
            background-color: #7CFFE0;
            box-shadow: 0 0 20px rgba(100, 255, 218, 0.3);
        }

        /* برای موبایل */
        @media (max-width: 768px) {
            body { flex-direction: column; height: auto; overflow: auto; }
            .cart-section { width: 100%; height: auto; }
            .products-section { border-left: none; padding: 1rem; }
            .grid-products { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <!-- بخش محصولات -->
    <div class="products-section">
        <div class="header-title">
            <i class="fas fa-store"></i> فروشگاه من
        </div>
        <input type="text" class="search-bar" placeholder="جستجوی محصول...">
        
        <div class="grid-products" id="products-grid">
            <!-- محصولات با جاوااسکریپت ساخته می‌شوند -->
        </div>
    </div>

    <!-- بخش سبد خرید -->
    <div class="cart-section">
        <div class="cart-header">
            <h2><i class="fas fa-shopping-cart"></i> فاکتور فروش</h2>
            <button class="clear-btn" onclick="clearCart()"><i class="fas fa-trash"></i> پاک کردن</button>
        </div>
        
        <div class="cart-items" id="cart-items">
            <!-- آیتم‌های سبد خرید اینجا قرار می‌گیرند -->
            <div style="text-align: center; color: var(--gray); margin-top: 2rem;" id="empty-cart-msg">
                <i class="fas fa-box-open" style="font-size: 2rem; margin-bottom: 1rem; opacity: 0.5;"></i>
                <br>سبد خرید خالی است.
            </div>
        </div>

        <div class="cart-footer">
            <div class="total-row">
                <span>مبلغ قابل پرداخت:</span>
                <span class="total-price" id="total-price">۰ تومان</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">ثبت فاکتور و پرداخت</button>
        </div>
    </div>

    <script>
        // داده‌های اولیه محصولات (شبیه‌سازی دیتابیس)
        const products = [
            { id: 1, name: 'نان تافتون', price: 15000, icon: 'fa-bread-slice' },
            { id: 2, name: 'شیر پرچرب', price: 32000, icon: 'fa-bottle-water' },
            { id: 3, name: 'پنیر سفید', price: 85000, icon: 'fa-cheese' },
            { id: 4, name: 'نوشابه کوکا', price: 18000, icon: 'fa-glass-water' },
            { id: 5, name: 'تخم مرغ', price: 120000, icon: 'fa-egg' },
            { id: 6, name: 'برنج ایرانی', price: 450000, icon: 'fa-wheat-awn' },
            { id: 7, name: 'روغن مایع', price: 95000, icon: 'fa-bottle-droplet' },
            { id: 8, name: 'ماکارونی', price: 25000, icon: 'fa-bowl-food' }
        ];

        let cart = [];

        // نمایش محصولات در صفحه
        function renderProducts() {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';
            
            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => addToCart(product.id);
                card.innerHTML = `
                    <div class="product-icon"><i class="fas ${product.icon}"></i></div>
                    <div class="product-name">${product.name}</div>
                    <div class="product-price">${product.price.toLocaleString('fa-IR')} تومان</div>
                `;
                grid.appendChild(card);
            });
        }

        // افزودن به سبد خرید
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const cartItem = cart.find(item => item.id === productId);

            if (cartItem) {
                cartItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            renderCart();
        }

        // نمایش سبد خرید
        function renderCart() {
            const cartContainer = document.getElementById('cart-items');
            const emptyMsg = document.getElementById('empty-cart-msg');
            
            // حذف آیتم‌های قبلی
            cartContainer.innerHTML = '';

            if (cart.length === 0) {
                cartContainer.innerHTML = `
                    <div style="text-align: center; color: var(--gray); margin-top: 2rem;" id="empty-cart-msg">
                        <i class="fas fa-box-open" style="font-size: 2rem; margin-bottom: 1rem; opacity: 0.5;"></i>
                        <br>سبد خرید خالی است.
                    </div>`;
                document.getElementById('total-price').innerText = '۰ تومان';
                return;
            }

            let total = 0;

            cart.forEach(item => {
                total += item.price * item.quantity;
                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <div class="cart-item-info">
                        <h4>${item.name}</h4>
                        <span>${(item.price * item.quantity).toLocaleString('fa-IR')} تومان</span>
                    </div>
                    <div class="cart-item-controls">
                        <button onclick="decreaseQty(${item.id})">-</button>
                        <span>${item.quantity}</span>
                        <button onclick="increaseQty(${item.id})">+</button>
                    </div>
                `;
                cartContainer.appendChild(div);
            });

            document.getElementById('total-price').innerText = total.toLocaleString('fa-IR') + ' تومان';
        }

        // افزایش تعداد
        function increaseQty(id) {
            const item = cart.find(i => i.id === id);
            if (item) { item.quantity += 1; renderCart(); }
        }

        // کاهش تعداد
        function decreaseQty(id) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.quantity -= 1;
                if (item.quantity === 0) {
                    cart = cart.filter(i => i.id !== id);
                }
                renderCart();
            }
        }

        // پاک کردن سبد خرید
        function clearCart() {
            cart = [];
            renderCart();
        }

        // ثبت فاکتور (شبیه‌سازی)
        function checkout() {
            if (cart.length === 0) {
                alert('سبد خرید خالی است!');
                return;
            }
            alert('✅ فاکتور با موفقیت ثبت شد و به صندوق ارسال گردید.');
            clearCart();
        }

        // اجرای اولیه
        renderProducts();
        renderCart();
    </script>
</body>
</html>
